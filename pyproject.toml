[project]
name = "oet"
dynamic = ["version"]
description = "External methods interface for the quantum chemical ORCA software package."
authors = [
    {name = "FACCTS GmbH", email = "info@faccts.de"},
]
dependencies = [
    "waitress>=3.0.2",
    "flask>=3.1.2",
    "requests>=2.32.5",
    "psutil>=7.1.0",
    "pytest>=8.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
]
keywords = [
  "orca",
  "hpc",
  "chemistry",
  "machine learning",
  "interface",
]

[project.urls]
Homepage = "https://faccts.de"
Repository = "https://github.com/faccts/orca-external-tools"
Issues = "https://github.com/faccts/orca-external-tools/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

# dynamic versioning
[tool.setuptools_scm]

# > Wheel target
[tool.hatch.build.targets.wheel]
packages = ["src/oet"]

[project.scripts]
oet_aenet = "oet.calculator.aenet:main"
oet_aimnet2 = "oet.calculator.aimnet2:main"
oet_gxtb = "oet.calculator.gxtb:main"
oet_mace = "oet.calculator.mace:main"
oet_mlatom = "oet.calculator.mlatom:main"
oet_mopac = "oet.calculator.mopac:main"
oet_uma = "oet.calculator.uma:main"
oet_xtb = "oet.calculator.xtb:main"
oet_client = "oet.server_client.client:client"
oet_server = "oet.server_client.server:main"
oet = "oet.scripts.oet:main"

# $$$$$$$$$$$$$$$$$$$$$$$$$$$$
#    DEPENDENCY GROUPS
# $$$$$$$$$$$$$$$$$$$$$$$$$$$$

[project.optional-dependencies]
aimnet2 = [
    "aimnet>=0.2,<0.3",
]

mace = [
    "mace-torch>=0.3.14",
]

mlatom = [
    # Torch currently requires setuptools<82.
    "setuptools<82.0.0",
    "mlatom>=3.12.0",
    "torchani==2.2.4",
    "joblib>=1.5.3",
]

uma = [
    "setuptools<82.0.0",
    "fairchem-core>=2.2.0",
]

dev = [
    "nox>=2025.5.1",
]
lint = [
    "ruff>=0.16.0",
]
type-check = [
    "mypy>=1.16.0,<2",
    "pydantic>=2.11.5,<3",
    "types-waitress>=3.0.1",
    "types-requests>=2.32.0",
    "types_psutil>=7.0.0"
]
spell-check = [
    "codespell>=2.4.1",
]
dead-code = [
    "vulture>=2.14",
]

# ////  MYPY  ////
[tool.mypy]
strict = true
pretty = true
files = [
    "src/",
]
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = [
  "aimnet", "aimnet.*",
  "torch", "torch.*",
  "fairchem.core", "fairchem.core.*",
  "ase", "ase.*",
  "huggingface_hub", "huggingface_hub.*",
  "mace", "mace.*",
]
ignore_missing_imports = true

# ////  RUFF  ////
[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py"
]
# > Default max line-length: 100 chars
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001" # Allow to catch blind exceptions.
]


# ////  PYTEST  ////
[tool.pytest.ini_options]
markers = [
    "network: tests that download models from the network (run via OET_RUN_NETWORK_TESTS=1)",
]


# ////  CODESPELL  ////
[tool.codespell]
skip = '*.pyc,*.densities*,*.gbw,./build/,./_venv'
# Whitelist chemical element symbols that codespell mistakes for typos.
# Te = tellurium (Z=52), Nd = neodymium (Z=60) — both appear in
# src/oet/calculator/aimnet2.py's _PERIODIC_TABLE.
ignore-words-list = "te,nd"
count = true
summary = true
quiet-level = 3
enable-colors = true


# ////  VULTURE  ////
[tool.vulture]
#exclude = []
#ignore_decorators = []
make_whitelist = false
min_confidence = 70
paths = ["src/"]
#verbose = false
